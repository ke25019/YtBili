org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# Serialised deliberately: parallel dexing on this machine collided with
# Windows Defender holding freshly written .dex files ("another process is
# using this file"), which presented as a silent stall.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=false

# Build output is redirected to D: in the root build script. Windows Defender's
# real-time engine holds freshly written .dex files on H:, which made dexing
# fail with "another process is using this file".

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
ksp.incremental=true
